name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting with Black
        run: |
          python -m black --check analysis.py preprocess.py tests

      - name: Lint with flake8
        run: |
          python -m flake8 analysis.py preprocess.py tests

      - name: Run tests
        run: |
          python -m pytest -v